<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理科 音の波形・周波数テスト v2</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d7dce4;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:920px;margin:auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:14px 0}
h1{font-size:27px;margin:0 0 8px} h2{margin:0 0 16px}
p{line-height:1.6}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:white;margin-right:8px}
button.stop{background:#374151}
button:disabled{opacity:.45}
.status{font-weight:800;padding:9px 13px;border-radius:999px;background:#eef2ff;display:inline-block}
.ok{color:#166534}.bad{color:#991b1b}.warn{color:#92400e}
.meter{height:30px;background:#e5e7eb;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
canvas{display:block;width:100%;height:230px;background:#111827;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{font-size:42px;font-weight:900}
.note{font-size:28px;font-weight:800}
.small{color:var(--muted);font-size:14px}
pre{background:#111827;color:#e5e7eb;padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎤 理科 音の波形・周波数テスト v2</h1>
  <p class="small">音声は保存・送信しません。端末内だけで解析します。</p>

  <div class="card">
    <button id="start">マイクを開始</button>
    <button id="stop" class="stop" disabled>停止</button>
    <span id="status" class="status">未開始</span>
  </div>

  <div class="card">
    <h2>入力レベル</h2>
    <div class="meter"><div id="bar" class="bar"></div></div>
    <p>音量: <b id="level">0</b></p>
  </div>

  <div class="card">
    <h2>波形</h2>
    <canvas id="scope" width="900" height="230"></canvas>
  </div>

  <div class="grid">
    <div class="card">
      <h2>周波数</h2>
      <div class="big"><span id="freq">---</span> Hz</div>
      <p class="small">声を「あーーー」と一定に伸ばすと安定しやすいです。</p>
    </div>
    <div class="card">
      <h2>音名</h2>
      <div id="note" class="note">---</div>
      <p>判定の確かさ: <b id="confidence">---</b></p>
    </div>
  </div>

  <div class="card">
    <h2>診断ログ</h2>
    <pre id="log">ページを読み込みました。</pre>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let stream=null, ac=null, analyser=null, src=null, raf=null;
let data=null, smoothFreq=null;

function log(s){
  $('log').textContent += '\n['+new Date().toLocaleTimeString('ja-JP')+'] '+s;
}
function status(s,cls=''){ $('status').textContent=s; $('status').className='status '+cls; }

function noteName(freq){
  if(!freq || freq<40 || freq>2000) return '---';
  const midi=Math.round(69+12*Math.log2(freq/440));
  const names=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
  return names[(midi%12+12)%12] + (Math.floor(midi/12)-1);
}

/* 正規化自己相関。人の声でも拾いやすいように閾値を緩め、
   40〜1500 Hz に絞り、最良ピークを探す。 */
function detectPitch(buf, sampleRate){
  const n=buf.length;
  let mean=0;
  for(let i=0;i<n;i++) mean+=buf[i];
  mean/=n;

  let rms=0;
  const x=new Float32Array(n);
  for(let i=0;i<n;i++){
    x[i]=buf[i]-mean;
    rms+=x[i]*x[i];
  }
  rms=Math.sqrt(rms/n);
  if(rms<0.008) return {freq:-1,confidence:0};

  const minFreq=40, maxFreq=1500;
  const minLag=Math.floor(sampleRate/maxFreq);
  const maxLag=Math.min(Math.floor(sampleRate/minFreq), Math.floor(n/2));

  let bestLag=-1, bestCorr=-1;
  const corr=new Float32Array(maxLag+1);

  for(let lag=minLag;lag<=maxLag;lag++){
    let sum=0, e1=0, e2=0;
    const lim=n-lag;
    for(let i=0;i<lim;i++){
      const a=x[i], b=x[i+lag];
      sum+=a*b; e1+=a*a; e2+=b*b;
    }
    const c=(e1>0&&e2>0)?sum/Math.sqrt(e1*e2):0;
    corr[lag]=c;
    if(c>bestCorr){ bestCorr=c; bestLag=lag; }
  }

  if(bestLag<0 || bestCorr<0.35) return {freq:-1,confidence:Math.max(0,bestCorr)};

  // 倍音を基本周波数と誤認しにくくする。
  // 十分高い相関を持つ、より長い周期候補を優先。
  const target=bestCorr*0.92;
  for(let lag=bestLag+1;lag<=maxLag;lag++){
    if(corr[lag]>=target){
      // 近傍ピークか確認
      if(corr[lag]>=corr[lag-1] && (lag===maxLag || corr[lag]>=corr[lag+1])){
        bestLag=lag; bestCorr=corr[lag];
      }
    }
  }

  // 放物線補間
  let lag=bestLag;
  if(bestLag>minLag && bestLag<maxLag){
    const y1=corr[bestLag-1], y2=corr[bestLag], y3=corr[bestLag+1];
    const d=(y1-2*y2+y3);
    if(Math.abs(d)>1e-9) lag=bestLag+0.5*(y1-y3)/d;
  }

  const f=sampleRate/lag;
  if(f<minFreq || f>maxFreq) return {freq:-1,confidence:bestCorr};
  return {freq:f,confidence:bestCorr};
}

function draw(){
  if(!analyser||!ac) return;
  analyser.getFloatTimeDomainData(data);

  let rms=0;
  for(let i=0;i<data.length;i++) rms+=data[i]*data[i];
  rms=Math.sqrt(rms/data.length);
  const level=Math.min(100,Math.round(rms*300));
  $('bar').style.width=level+'%';
  $('level').textContent=level;

  const c=$('scope'), g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle='#111827'; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle='#64748b'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,c.height/2); g.lineTo(c.width,c.height/2); g.stroke();

  g.strokeStyle='#f8fafc'; g.lineWidth=2; g.beginPath();
  for(let i=0;i<data.length;i++){
    const xx=i/(data.length-1)*c.width;
    const yy=c.height/2 - data[i]*(c.height*0.44);
    if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
  }
  g.stroke();

  const result=detectPitch(data,ac.sampleRate);
  if(result.freq>0){
    if(smoothFreq==null) smoothFreq=result.freq;
    else smoothFreq=smoothFreq*0.80+result.freq*0.20;
    $('freq').textContent=Math.round(smoothFreq);
    $('note').textContent=noteName(smoothFreq);
    $('confidence').textContent=Math.round(result.confidence*100)+'%';
  }else{
    // すぐ消さず少しだけ保持。ただし無音なら消す。
    if(rms<0.006){
      smoothFreq=null;
      $('freq').textContent='---';
      $('note').textContent='---';
      $('confidence').textContent='---';
    } else {
      $('confidence').textContent=Math.round(result.confidence*100)+'%';
    }
  }

  raf=requestAnimationFrame(draw);
}

$('start').onclick=async()=>{
  $('start').disabled=true; status('マイク要求中…','warn'); log('マイク取得開始');
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false
    });
    const AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    if(ac.state==='suspended') await ac.resume();
    analyser=ac.createAnalyser();
    analyser.fftSize=4096;
    analyser.smoothingTimeConstant=0;
    data=new Float32Array(analyser.fftSize);
    src=ac.createMediaStreamSource(stream);
    src.connect(analyser);
    status('マイク取得成功 ✅','ok');
    $('stop').disabled=false;
    log('取得成功 / sampleRate='+ac.sampleRate+' / fftSize='+analyser.fftSize);
    draw();
  }catch(e){
    status(e.name||'Error','bad');
    log('失敗: '+(e.name||'Error')+' / '+(e.message||e));
  }finally{
    $('start').disabled=false;
  }
};

$('stop').onclick=()=>{
  if(raf) cancelAnimationFrame(raf);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(src) try{src.disconnect()}catch(e){}
  if(ac) try{ac.close()}catch(e){}
  stream=ac=analyser=src=raf=null; smoothFreq=null;
  $('stop').disabled=true; $('bar').style.width='0%'; $('level').textContent='0';
  $('freq').textContent='---'; $('note').textContent='---'; $('confidence').textContent='---';
  status('停止しました'); log('停止');
};
})();
</script>
</body>
</html>
